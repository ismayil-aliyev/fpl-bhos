<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHOS FPL Mini League - Head to Head</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- noUiSlider -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>

    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', system-ui, sans-serif; }
        .fpl-purple { background-color: #37003C; }
        .fpl-purple-text { color: #37003C; }
        .fpl-green { color: #00FF87; }
        .fpl-green-bg { background-color: #00FF87; }
        
        .noUi-connect { background-color: #37003C; }
        .noUi-handle { border-radius: 50%; background: #00FF87; border: 2px solid #37003C; box-shadow: none; cursor: grab; }
        .noUi-handle:before, .noUi-handle:after { display: none; }
        .noUi-handle:active { cursor: grabbing; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="fpl-purple text-white p-5 shadow-lg flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl font-bold flex items-center gap-3">
                <span class="text-3xl">⚔️</span> BHOS FPL mini league
            </h1>
            <div class="text-sm text-gray-300 mt-1">Head-to-Head Comparison Dashboard</div>
        </div>
        <div class="flex items-center gap-4">
            <a href="index.html" class="text-sm font-semibold hover:text-[#00FF87] transition-colors underline">History</a>
            <span class="text-gray-400">|</span>
            <a href="squad_dashboard.html" class="text-sm font-semibold hover:text-[#00FF87] transition-colors underline">Squad Insights</a>
            <div id="loadingStatus" class="fpl-green font-semibold text-sm animate-pulse bg-purple-800 px-3 py-1 rounded ml-4">
                Loading Data...
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="appContent" class="max-w-[1400px] mx-auto px-4 grid grid-cols-1 xl:grid-cols-4 gap-6 hidden">
        
        <!-- SIDEBAR CONTROLS -->
        <div class="bg-white p-5 rounded-xl shadow-md border border-gray-200 xl:col-span-1 h-fit">
            <h2 class="text-lg font-extrabold text-gray-800 mb-5 border-b pb-2">Matchup Controls</h2>
            
            <!-- Profile Selection -->
            <div class="mb-4 space-y-3 bg-gray-50 p-3 rounded-lg border border-gray-200">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Profile 1 (Home)</label>
                    <select id="profile1Select" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-purple-800 outline-none" onchange="updateDashboard()">
                        <!-- Populated by JS -->
                    </select>
                </div>
                <div class="text-center font-bold text-gray-400 text-xs italic">VS</div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Profile 2 (Away)</label>
                    <select id="profile2Select" class="w-full border border-gray-300 rounded p-2 text-sm focus:border-purple-800 outline-none" onchange="updateDashboard()">
                        <!-- Populated by JS -->
                    </select>
                </div>
            </div>

            <!-- Gameweek Slider -->
            <div class="mb-6 mt-6">
                <label class="block text-sm font-bold text-gray-700 mb-4 flex justify-between">
                    <span>Gameweek Range</span>
                    <span id="sliderValues" class="text-purple-700 font-extrabold">GW 1 - 38</span>
                </label>
                <div class="px-2">
                    <div id="gwSlider"></div>
                </div>
            </div>

            <!-- Metric & Grouping -->
            <div class="mb-4 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Insight Metric</label>
                    <select id="metricSelect" class="w-full border-2 border-gray-300 rounded-lg p-2 text-sm font-medium focus:border-purple-800 outline-none transition-colors" onchange="updateDashboard()">
                        <!-- Populated by JS -->
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Group Stack By</label>
                    <select id="groupBySelect" class="w-full border-2 border-purple-300 rounded-lg p-2 text-sm font-medium focus:border-purple-800 outline-none transition-colors bg-purple-50" onchange="updateDashboard()">
                        <option value="Position">Player Position (FWD, MID, DEF, GKP)</option>
                        <option value="Team">PL Team (Arsenal, Liverpool, etc.)</option>
                        <option value="Player">Individual Player Name</option>
                        <option value="Category">FPL Category (Goalkeeper, Substitutes, etc.)</option>
                        <option value="Starter/Sub">Starter vs Sub</option>
                    </select>
                </div>
            </div>

            <!-- Display Toggles -->
            <div class="space-y-3 mt-6">
                <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg">
                    
                    <label class="flex items-center cursor-pointer mb-3">
                        <input type="checkbox" id="percentToggle" class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500 mr-3" onchange="updateDashboard()">
                        <div>
                            <div class="text-sm font-bold text-gray-800">100% Stacked (Percentage)</div>
                            <div class="text-xs text-gray-500">View as proportion of total</div>
                        </div>
                    </label>

                    <label class="flex items-center cursor-pointer mb-3 border-t border-gray-200 pt-3">
                        <input type="checkbox" id="cumulativeToggle" class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500 mr-3" onchange="updateDashboard()">
                        <div>
                            <div class="text-sm font-bold text-gray-800">Cumulative Values</div>
                            <div class="text-xs text-gray-500">Accumulate totals over gameweeks</div>
                        </div>
                    </label>

                    <label class="flex items-center cursor-pointer border-t border-gray-200 pt-3">
                        <input type="checkbox" id="includeBench" class="w-5 h-5 text-purple-600 rounded focus:ring-purple-500 mr-3" onchange="updateDashboard()">
                        <div>
                            <div class="text-sm font-bold text-gray-800">Include Bench Players</div>
                            <div class="text-xs text-gray-500">Default: Starters only.</div>
                        </div>
                    </label>
                </div>
            </div>
        </div>

        <!-- CHART AREA -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200 xl:col-span-3 flex flex-col">
            <div class="flex justify-between items-center mb-2">
                <h2 id="chartTitle" class="text-xl font-extrabold fpl-purple-text">Head to Head Comparison</h2>
            </div>
            <div class="text-sm text-gray-500 mb-4" id="chartSubtitle"></div>
            
            <div class="grid grid-cols-1 gap-8 flex-grow w-full">
                <!-- Chart 1 Container -->
                <div class="relative w-full min-h-[400px] border border-gray-100 rounded-lg p-4 bg-gray-50 flex flex-col">
                    <h3 id="chartTitle1" class="text-lg font-bold text-gray-800 mb-4 text-center"></h3>
                    <div class="relative flex-grow w-full">
                        <canvas id="chart1"></canvas>
                    </div>
                </div>
                <!-- Chart 2 Container -->
                <div class="relative w-full min-h-[400px] border border-gray-100 rounded-lg p-4 bg-gray-50 flex flex-col">
                    <h3 id="chartTitle2" class="text-lg font-bold text-gray-800 mb-4 text-center"></h3>
                    <div class="relative flex-grow w-full">
                        <canvas id="chart2"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Error State -->
    <div id="errorState" class="max-w-2xl mx-auto mt-10 bg-red-50 border-l-4 border-red-500 p-6 rounded shadow-md hidden">
        <h3 class="text-xl font-bold text-red-700 mb-2">Data Loading Error</h3>
        <p class="text-gray-700 mb-4">Could not load `squads.csv` or `id-name.csv`.</p>
        <p class="text-sm text-gray-500 mt-4" id="errorLog"></p>
    </div>

    <script>
        // --- 1. CONFIGURATION & METRICS ---
        const METRICS = {
            "Pts": "Total Points", "MP": "Minutes Played", "GS": "Goals Scored", 
            "A": "Assists", "CS": "Clean Sheets", "GC": "Goals Conceded", 
            "OG": "Own Goals", "PS": "Penalties Saved", "PM": "Penalties Missed", 
            "YC": "Yellow Cards", "RC": "Red Cards", "S": "Saves", 
            "BP": "Bonus Points", "BPS": "Bonus Points System", "I": "Influence", 
            "C": "Creativity", "T": "Threat", "II": "ICT Index", 
            "CBI": "Clearances, Blocks & Interceptions", "R": "Recoveries", 
            "DC": "Defensive Contributions", "ST": "Matches Started", 
            "xG": "Expected Goals", "xA": "Expected Assists", "xGI": "Expected Goal Involvements", 
            "xGC": "Expected Goals Conceded"
        };

        // Master FPL Team Hex Colors
        const TEAM_COLORS = {
            "Arsenal": "#EF0107",
            "Aston Villa": "#670E36",
            "Bournemouth": "#B50E12",
            "Brentford": "#E30613",
            "Brighton": "#0057B8",
            "Chelsea": "#034694",
            "Crystal Palace": "#1B458F",
            "Everton": "#003399",
            "Fulham": "#111111",
            "Ipswich": "#001F60",
            "Leeds": "#FFCD00",
            "Leicester": "#003090",
            "Liverpool": "#C8102E",
            "Man City": "#6CABDD",
            "Man Utd": "#DA291C",
            "Newcastle": "#333333",
            "Nott'm Forest": "#E53233",
            "Southampton": "#D71920",
            "Spurs": "#132257",
            "Sunderland": "#FF0000",
            "West Ham": "#7A263A",
            "Wolves": "#FDB913"
        };

        // Fallback colors for non-team categories (Positions, etc.)
        const PALETTE = [
            '#00FF87', '#37003C', '#E3004F', '#00E0FF', '#FF8A00', 
            '#02894E', '#800080', '#005BBB', '#D3A300', '#FF005A',
            '#4A5568', '#8B5CF6', '#EC4899', '#F59E0B', '#10B981'
        ];

        const STATE = {
            squads: [],
            names: {},
            playerToTeam: {}, // Maps 'Saka' -> 'Arsenal'
            maxGW: 38,
            colorMap: {}, // Resets on each update
            teamPlayerCount: {} // Tracks how many players from a team are mapped so we can offset colors
        };

        let chartInstance1 = null;
        let chartInstance2 = null;

        // --- 2. INITIALIZATION ---
        async function initApp() {
            populateMetricDropdown();

            try {
                const [squadsRes, namesRes] = await Promise.all([
                    fetch('squads.csv').then(r => r.text()),
                    fetch('id-name.csv').then(r => r.text())
                ]);

                // Parse Names
                Papa.parse(namesRes, {
                    header: true, skipEmptyLines: true,
                    transformHeader: h => h.replace(/^[\u200B-\u200D\uFEFF]+/, '').trim(),
                    transform: v => typeof v === 'string' ? v.trim() : v,
                    complete: function(results) {
                        results.data.forEach(row => {
                            if(row.ID && row.Name) STATE.names[String(row.ID).trim()] = row.Name.trim();
                        });
                    }
                });

                // Parse Squads
                Papa.parse(squadsRes, {
                    header: true, skipEmptyLines: true,
                    transformHeader: h => h.replace(/^[\u200B-\u200D\uFEFF]+/, '').trim(),
                    transform: v => typeof v === 'string' ? v.trim() : v,
                    complete: function(results) {
                        STATE.squads = results.data;
                        
                        let maxWeek = 1;
                        STATE.squads.forEach(r => {
                            let w = parseInt(r['Week'] || r['GW']);
                            if(w > maxWeek) maxWeek = w;

                            // Map players to their teams for the dynamic color logic
                            if (r['Player'] && r['Team']) {
                                STATE.playerToTeam[r['Player'].trim()] = r['Team'].trim();
                            }
                        });
                        STATE.maxGW = maxWeek || 38;

                        buildUI();
                    }
                });
            } catch (error) {
                document.getElementById('loadingStatus').style.display = 'none';
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorLog').innerText = error.toString();
            }
        }

        function populateMetricDropdown() {
            const select = document.getElementById('metricSelect');
            Object.keys(METRICS).forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.innerText = `${key} - ${METRICS[key]}`;
                select.appendChild(option);
            });
        }

        // --- 3. UI SETUP ---
        function buildUI() {
            document.getElementById('loadingStatus').style.display = 'none';
            document.getElementById('appContent').classList.remove('hidden');

            const p1 = document.getElementById('profile1Select');
            const p2 = document.getElementById('profile2Select');
            
            const availableIds = [...new Set(STATE.squads.map(r => String(r['Profile ID'] || r['Profile_ID'] || r['ID']).trim()))].filter(id => id);
            
            availableIds.forEach((id) => {
                const name = STATE.names[id] || `Manager ${id}`;
                p1.appendChild(new Option(name, id));
                p2.appendChild(new Option(name, id));
            });

            if (p2.options.length > 1) p2.selectedIndex = 1;

            const slider = document.getElementById('gwSlider');
            noUiSlider.create(slider, {
                start: [1, STATE.maxGW],
                connect: true, step: 1,
                range: { 'min': 1, 'max': 38 },
                format: { to: v => Math.round(v), from: v => Math.round(v) }
            });

            slider.noUiSlider.on('update', function (values) {
                document.getElementById('sliderValues').innerText = `GW ${values[0]} - ${values[1]}`;
            });

            slider.noUiSlider.on('change', updateDashboard);

            updateDashboard();
        }

        // Smart color assignment based on Premier League team identities
        function getColorForCategory(cat, groupBy) {
            if (STATE.colorMap[cat]) return STATE.colorMap[cat];

            let baseColor = null;

            if (groupBy === 'Team') {
                // Fuzzy match the team
                let matchedTeam = Object.keys(TEAM_COLORS).find(t => cat.toLowerCase().includes(t.toLowerCase()) || t.toLowerCase().includes(cat.toLowerCase()));
                if (matchedTeam) baseColor = TEAM_COLORS[matchedTeam];
            } 
            else if (groupBy === 'Player') {
                let team = STATE.playerToTeam[cat];
                if (team) {
                    let matchedTeam = Object.keys(TEAM_COLORS).find(t => team.toLowerCase().includes(t.toLowerCase()) || t.toLowerCase().includes(team.toLowerCase()));
                    if (matchedTeam) {
                        // We found their team! Track how many players from this team we've assigned
                        STATE.teamPlayerCount[matchedTeam] = (STATE.teamPlayerCount[matchedTeam] || 0) + 1;
                        let count = STATE.teamPlayerCount[matchedTeam] - 1;
                        
                        // Apply a deterministic shading offset to avoid duplicate colors
                        const offsets = [0, 40, -40, 80, -80, 20, -20, 60, -60, 100, -100];
                        let amount = offsets[count % offsets.length];
                        
                        // Shift RGB values up or down by the offset
                        baseColor = '#' + TEAM_COLORS[matchedTeam].replace(/^#/, '').replace(/../g, hex => 
                            ('0' + Math.min(255, Math.max(0, parseInt(hex, 16) + amount)).toString(16)).substr(-2)
                        );
                    }
                }
            }

            if (!baseColor) {
                // Fallback for Positions, Categories, or Unknown teams
                const colorIdx = Object.keys(STATE.colorMap).length % PALETTE.length;
                baseColor = PALETTE[colorIdx];
            }

            STATE.colorMap[cat] = baseColor;
            return baseColor;
        }

        // --- 4. DATA AGGREGATION & CHARTING ---
        function updateDashboard() {
            const sliderVals = document.getElementById('gwSlider').noUiSlider.get();
            const startGW = parseInt(sliderVals[0]);
            const endGW = parseInt(sliderVals[1]);
            
            const profile1 = document.getElementById('profile1Select').value;
            const profile2 = document.getElementById('profile2Select').value;
            
            const p1Name = STATE.names[profile1] || `Manager ${profile1}`;
            const p2Name = STATE.names[profile2] || `Manager ${profile2}`;

            const metricKey = document.getElementById('metricSelect').value;
            const metricName = METRICS[metricKey];
            const groupBy = document.getElementById('groupBySelect').value;
            
            const isPercent = document.getElementById('percentToggle').checked;
            const isCumulative = document.getElementById('cumulativeToggle').checked;
            const includeBench = document.getElementById('includeBench').checked;

            document.getElementById('chartTitle').innerText = `${p1Name} vs ${p2Name}`;
            document.getElementById('chartSubtitle').innerText = `${metricName} | Grouped by ${groupBy} | GW ${startGW}-${endGW}`;

            // Reset dynamic color mapping for this specific chart execution
            STATE.colorMap = {};
            STATE.teamPlayerCount = {};

            const agg = {};
            const gwTotals = {};

            for (let gw = 1; gw <= endGW; gw++) {
                agg[gw] = { [profile1]: {}, [profile2]: {} };
                gwTotals[gw] = { [profile1]: 0, [profile2]: 0 };
            }

            const uniqueCategories = new Set();

            STATE.squads.forEach(row => {
                let gwStr = row['Week'] || row['GW'];
                let idRaw = row['Profile ID'] || row['Profile_ID'] || row['ID'];
                
                if (!gwStr || !idRaw) return;
                
                let gw = parseInt(gwStr);
                let id = String(idRaw).trim();
                
                if (gw >= 1 && gw <= endGW && (id === profile1 || id === profile2)) {
                    if (!includeBench && String(row['Starter/Sub']).trim() !== 'Starter') return;

                    let cat = (row[groupBy] || "Unknown").trim();
                    let val = parseFloat(row[metricKey]);
                    
                    if (!isNaN(val)) {
                        if (gw >= startGW) uniqueCategories.add(cat);
                        agg[gw][id][cat] = (agg[gw][id][cat] || 0) + val;
                        gwTotals[gw][id] += val;
                    }
                }
            });

            const datasets1 = [];
            const datasets2 = [];
            const labels = [];
            
            for (let gw = startGW; gw <= endGW; gw++) {
                labels.push(`GW ${gw}`);
            }

            // Calculate totals for sorting categories descending (Largest values at the bottom of the stack)
            const categoryTotals = {};
            Array.from(uniqueCategories).forEach(cat => {
                categoryTotals[cat] = 0;
                for (let gw = startGW; gw <= endGW; gw++) {
                    let val1 = 0, val2 = 0;
                    if (isCumulative) {
                        for(let g=1; g<=gw; g++) {
                            val1 += (agg[g][profile1][cat] || 0);
                            val2 += (agg[g][profile2][cat] || 0);
                        }
                    } else {
                        val1 = (agg[gw][profile1][cat] || 0);
                        val2 = (agg[gw][profile2][cat] || 0);
                    }
                    categoryTotals[cat] += val1 + val2;
                }
            });

            // Filter out categories that are 0 in the viewed window and sort descending
            const activeCategories = Array.from(uniqueCategories).filter(cat => categoryTotals[cat] > 0);
            const sortedCategories = activeCategories.sort((a, b) => categoryTotals[b] - categoryTotals[a]);

            sortedCategories.forEach(cat => {
                const color = getColorForCategory(cat, groupBy);

                // Profile 1 Dataset
                datasets1.push({
                    label: cat, 
                    data: labels.map((_, i) => {
                        let currentGW = startGW + i;
                        let val = 0;
                        let total = 0;

                        if (isCumulative) {
                            for (let g = 1; g <= currentGW; g++) {
                                val += (agg[g][profile1][cat] || 0);
                                total += gwTotals[g][profile1];
                            }
                        } else {
                            val = agg[currentGW][profile1][cat] || 0;
                            total = gwTotals[currentGW][profile1];
                        }

                        if (isPercent && total > 0) return (val / total) * 100;
                        return val;
                    }),
                    backgroundColor: color,
                    borderColor: '#ffffff',
                    borderWidth: 1
                });

                // Profile 2 Dataset
                datasets2.push({
                    label: cat,
                    data: labels.map((_, i) => {
                        let currentGW = startGW + i;
                        let val = 0;
                        let total = 0;

                        if (isCumulative) {
                            for (let g = 1; g <= currentGW; g++) {
                                val += (agg[g][profile2][cat] || 0);
                                total += gwTotals[g][profile2];
                            }
                        } else {
                            val = agg[currentGW][profile2][cat] || 0;
                            total = gwTotals[currentGW][profile2];
                        }

                        if (isPercent && total > 0) return (val / total) * 100;
                        return val;
                    }),
                    backgroundColor: color,
                    borderColor: '#ffffff',
                    borderWidth: 1
                });
            });

            document.getElementById('chartTitle1').innerText = p1Name;
            document.getElementById('chartTitle2').innerText = p2Name;

            renderH2HCharts(labels, datasets1, datasets2, metricName, isPercent);
        }

        function renderH2HCharts(labels, datasets1, datasets2, metricName, isPercent) {
            if (chartInstance1) chartInstance1.destroy();
            if (chartInstance2) chartInstance2.destroy();

            Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";
            
            // Base config for both charts
            const getBaseOptions = () => ({
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    axis: 'x',
                    intersect: false
                },
                plugins: {
                    tooltip: {
                        itemSort: (a, b) => b.parsed.y - a.parsed.y, // Sort tooltip descending by value
                        backgroundColor: 'rgba(55, 0, 60, 0.95)',
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 13 },
                        padding: 12, 
                        cornerRadius: 8,
                        callbacks: {
                            label: function(context) {
                                let val = context.parsed.y;
                                if (val === 0) return null; // Hide 0s in tooltip
                                let formattedVal = isPercent ? val.toFixed(1) + '%' : parseFloat(val.toFixed(2));
                                return `${context.dataset.label}: ${formattedVal}`;
                            }
                        }
                    }
                },
                scales: {
                    x: { 
                        stacked: true,
                        grid: { display: false }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        max: isPercent ? 100 : undefined,
                        title: {
                            display: true,
                            text: metricName, // Use dropdown metric name
                            font: { weight: 'bold' }
                        }
                    }
                }
            });

            // Draw Chart 1 (WITH unified legend)
            const options1 = getBaseOptions();
            options1.plugins.legend = {
                position: 'right',
                labels: { boxWidth: 15 },
                onClick: function(e, legendItem, legend) {
                    const index = legendItem.datasetIndex;
                    if (chartInstance1.isDatasetVisible(index)) {
                        chartInstance1.hide(index);
                        if (chartInstance2) chartInstance2.hide(index);
                        legendItem.hidden = true;
                    } else {
                        chartInstance1.show(index);
                        if (chartInstance2) chartInstance2.show(index);
                        legendItem.hidden = false;
                    }
                }
            };
            
            const ctx1 = document.getElementById('chart1').getContext('2d');
            chartInstance1 = new Chart(ctx1, {
                type: 'bar',
                data: { labels: labels, datasets: datasets1 },
                options: options1
            });

            // Draw Chart 2 (HIDDEN legend, relies on Chart 1's legend)
            const options2 = getBaseOptions();
            options2.plugins.legend = { display: false };

            const ctx2 = document.getElementById('chart2').getContext('2d');
            chartInstance2 = new Chart(ctx2, {
                type: 'bar',
                data: { labels: labels, datasets: datasets2 },
                options: options2
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
